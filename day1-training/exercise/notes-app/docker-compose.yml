services:
  # Level 1: Basic Services (db, redis, app)
  # Level 3: Add dedicated networks and volumes
  # Level 4: Add healthchecks and resource limits
  # Level 5: Add secrets and .env validation

  db:
    image: postgres:16-alpine
    restart: always
    # TODO: Environment (Level 1)
    environment:
      POSTGRES_DB: notedb
      POSTGRES_USER: noteuser
      POSTGRES_PASSWORD: SuperSecretDatabasePassword123!
    # TODO: Healthcheck (Level 4)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noteuser -d notedb"]
      interval: 5s
      timeout: 5s
      retries: 5
    # TODO: Volumes (Level 3)

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # TODO: Healthcheck (Level 4)

  app:
    # TODO: Build & Ports (Level 1)
    # TODO: Multi-stage build (Level 2)
    # TODO: Networks (Level 3)
    # TODO: Depends_on & Limits (Level 4)
    # TODO: Secrets (Level 5)
    build:
      context: .
    image: notes-app:latest  
    ports:
      - "8081:8081"
    environment:
      DB_HOST: db # Uses the service name as the hostname
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: noteuser
      DB_PASSWORD: SuperSecretDatabasePassword123!
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
    # 3. Resource Limits (Cgroups)
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

secrets:
  db_password:
    file: ./db_password.txt
