services:
  # Level 1: Basic Services (db, redis, app)
  # Level 3: Add dedicated networks and volumes
  # Level 4: Add healthchecks and resource limits
  # Level 5: Add secrets and .env validation
  db:
    networks:
      - exercise_net
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: tododb
      POSTGRES_USER: todouser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    # Persist Postgres data on a named volume
    volumes:
      - db-data:/var/lib/postgresql/data
    # 1. Healthcheck: Only mark as healthy when pg_isready returns 0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todouser -d tododb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    networks:
      - exercise_net
    image: redis:7-alpine
    ports:
    - "6379:6379"
  app:
    networks:
      - exercise_net
    build: .
    ports:
      - "8081:8081"
    entrypoint: /bin/sh -c "export DB_PASSWORD=$(cat /run/secrets/db_password) && java -jar app.jar"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: tododb
      DB_USERNAME: todouser
      REDIS_HOST: redis
      APP_NAME: ${APP_NAME}
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

volumes:
  db-data:
    driver: local

networks:
  exercise_net:
    driver: bridge

secrets:
  db_password:
    file: db_password.txt
