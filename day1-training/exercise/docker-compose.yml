services:
  # Level 1: Basic Services (db, redis, app)
  # Level 3: Add dedicated networks and volumes
  # Level 4: Add healthchecks and resource limits
  # Level 5: Add secrets and .env validation

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tododb
      POSTGRES_USER: todouser
      POSTGRES_PASSWORD: todopass123
      #POSTGRES_PASSWORD: /run/secrets/db_password
    # TODO: Volumes (Level 3)
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - blu-net
    # TODO: Healthcheck (Level 4)
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U todouser -d tododb" ]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env
    secrets:
      - db_password

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - blu-net
    # TODO: Healthcheck (Level 4)
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 1s
      timeout: 3s
      retries: 5

  app:
    # TODO: Build & Ports (Level 1)
    build: ./notes-app
    ports:
      - "8081:${SERVER_PORT}"
    environment:
      APP_NAME: ${APP_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_NAME: tododb
      DB_USERNAME: todouser
      DB_PASSWORD: todopass123
      #DB_PASSWORD: /run/secrets/db_password
      REDIS_HOST: ${REDIS_HOST}
    # TODO: Multi-stage build (Level 2)
    depends_on:
      db:
          condition: service_healthy
      redis:
          condition: service_healthy
    # TODO: Networks (Level 3)
    networks:
      - blu-net
    # TODO: Depends_on & Limits (Level 4)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    env_file:
      - .env
    secrets:
      - db_password

networks:
  blu-net:
    driver: bridge

volumes:
  pgdata:

# TODO: Secrets (Level 5)
secrets:
  db_password:
    file: ./db_password.txt