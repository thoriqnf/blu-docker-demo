# Level 1: Basic Services (db, redis, app)
# Level 3: Add dedicated networks and volumes
# Level 4: Add healthchecks and resource limits
# Level 5: Add secrets and .env validation
services:
  db:
    image: postgres:16-alpine
    # Environment (Level 1)
    environment:
      POSTGRES_DB: tododb
      POSTGRES_USER: todouser
      POSTGRES_PASSWORD: todopass123
    # Volumes (Level 3)
    volumes:
      - db-data:/var/lib/postgresql/data
    # Healthcheck (Level 4)
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U todouser -d tododb" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Healthcheck (Level 4)
    environment:
      REDIS_HOST: redis
    healthcheck:
      test: [ "CMD", "sh", "-c", "redis-cli ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # Build & Ports (Level 1)
    build: ./notes-app
    ports:
      - "8081:8081"
    # TODO: Multi-stage build (Level 2)
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: tododb
      DB_USERNAME: todouser
      DB_PASSWORD: todopass123
      REDIS_HOST: redis
      REDIS_PORT: 6379
    # Networks (Level 3)
    # Depends_on & Limits (Level 4)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

# TODO: Secrets (Level 5)

# Networks (Level 3)
networks:
  todo-network:
    driver: bridge

volumes:
  db-data: