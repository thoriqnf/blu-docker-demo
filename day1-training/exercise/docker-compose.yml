version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
 
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./db_password.txt:/run/secrets/db_password:ro
    command: sh -c "if [ -f /run/secrets/db_password ]; then export POSTGRES_PASSWORD=$(cat /run/secrets/db_password); fi; exec docker-entrypoint.sh postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notesuser -d notesdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./notes-app
    ports:
      - "8081:8081"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - db
      - redis

    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

    env_file:
      - .env

    secrets:
      - db_password
    volumes:
      # Mount secret file into container for non-swarm compose
      - ./db_password.txt:/run/secrets/db_password:ro
secrets:
  db_password:
    file: ./db_password.txt